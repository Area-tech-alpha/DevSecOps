name: Org Cleanup - Stale Branches

# ============================================================
# Workflow CENTRALIZADO no DevSecOps.
# Roda todo dia às 9h BRT (12h UTC) e apaga, em todos os
# repos da org, TODA branch sem commit há mais de 3 dias —
# mergeada ou não — exceto main, develop, a branch padrão,
# branches de PR aberto e branches protegidas.
#
# ⚠️  ESTE REPO É PÚBLICO (precisa ser, para os workflows serem
#     usados pela org). Log e summary deste workflow são visíveis
#     para qualquer pessoa, por isso ele imprime SOMENTE totais:
#     nunca nome de repo, branch, SHA ou conta do bot.
#     Toda a lógica está em .github/scripts/org-cleanup-branches.sh
#     — não adicione echo/summary com dados dos repos aqui.
#
# Restauração: cada deleção fica na Activity do próprio repo
# (privada). Ver o cabeçalho do script.
# Usa BOT_PAT para ter acesso de escrita em toda a org.
# ============================================================

on:
  schedule:
    - cron: '0 12 * * *'  # Todo dia 09h BRT (12h UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulação (não apaga nada; no Actions mostra só totais)'
        required: false
        default: 'false'
        type: boolean
      days_threshold:
        description: 'Dias sem atividade para considerar stale'
        required: false
        default: '3'

concurrency:
  group: org-cleanup-branches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete stale branches
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Cleanup org branches
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          ORG: Area-tech-alpha
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          DAYS: ${{ inputs.days_threshold || '3' }}
        run: bash .github/scripts/org-cleanup-branches.sh
