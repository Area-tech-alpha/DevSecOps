# Alpha DevSecOps — regras Semgrep curadas (somente estas bloqueiam o CI)
# O gate ignora findings de p/security-audit e p/react (muito ruído).

rules:
  - id: devsecops.security.hardcoded-api-key
    patterns:
      - pattern-regex: '(?i)\b(api[_-]?key|secret[_-]?key|client[_-]?secret)\s*[:=]\s*[''"]([A-Za-z0-9_\-+=!@#$%^&*]{16,})[''"]'
      - pattern-not-regex: '(?i)process\.env\.'
      - pattern-not-regex: '(?i)(example|placeholder|dummy|changeme|your[_-]|test[_-]|fake[_-]|sample|xxxx)'
      - pattern-not-regex: '(?i)\$\{|`\$\{'
    message: "Chave de API ou client secret hardcoded. Use variáveis de ambiente ou um secret manager."
    languages: [generic]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
        - "*.sample"
        - ".env.example"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/*.test.js"
        - "**/*.test.jsx"
        - "**/*.spec.ts"
        - "**/*.spec.tsx"
        - "**/mock/**"
        - "**/mocks/**"
        - "**/fixtures/**"
        - "**/e2e/**"
        - "**/devsecops/**"

  - id: devsecops.security.hardcoded-connection-string
    patterns:
      - pattern-regex: '(?i)\b(database_url|connection_string|mongo_uri|redis_url|postgres_url|mysql_url)\s*[:=]\s*[''"]([^''"]{20,})[''"]'
      - pattern-not-regex: '(?i)process\.env\.'
      - pattern-not-regex: '(?i)(example|placeholder|localhost|127\.0\.0\.1|0\.0\.0\.0)'
    message: "Connection string hardcoded. Use variáveis de ambiente."
    languages: [generic]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
        - ".env.example"
        - "docker-compose*.yml"
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/devsecops/**"

  - id: devsecops.security.insecure-random
    patterns:
      - pattern-regex: 'Math\.random\(\)'
    message: "Math.random() não é criptograficamente seguro. Use crypto.randomBytes() ou crypto.randomUUID() para operações sensíveis."
    languages: [javascript, typescript]
    severity: WARNING
    paths:
      exclude:
        - "**/test/**"
        - "**/tests/**"
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
